name: Build Release (Launcher + APK)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到的 Release tag（如 v1.2.3-beta）。留空则不创建 Release，产物只作为 artifact 上传'
        type: string
        required: false
        default: ''
      release_name:
        description: 'Release 显示标题（留空默认用 tag 名）'
        type: string
        required: false
        default: ''
      release_notes:
        description: 'Release 说明（正文），留空则自动生成 commit 列表'
        type: string
        required: false
        default: ''

jobs:
  # ===================== 应用版本唯一来源：仓库根 VERSION =====================
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      version_code: ${{ steps.compute.outputs.version_code }}
      tag: ${{ steps.compute.outputs.tag }}
      wails_version: ${{ steps.compute.outputs.wails_version }}
      short_commit: ${{ steps.compute.outputs.short_commit }}
    steps:
      - name: Checkout MusicParty
        uses: actions/checkout@v4

      - name: Compute version
        id: compute
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          VER="$(cat VERSION)"
          VER="${VER#"${VER%%[![:space:]]*}"}"
          VER="${VER%"${VER##*[![:space:]]}"}"
          PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VER" =~ $PATTERN ]]; then
            echo 'VERSION must contain major.minor.patch or major.minor.patch-prerelease, without a v prefix.' >&2
            exit 1
          fi
          PRERELEASE="${BASH_REMATCH[5]}"
          IFS='.' read -ra IDENTIFIERS <<< "$PRERELEASE"
          for IDENTIFIER in "${IDENTIFIERS[@]}"; do
            if [[ "$IDENTIFIER" =~ ^0[0-9]+$ ]]; then
              echo 'Numeric prerelease identifiers in VERSION must not have leading zeros.' >&2
              exit 1
            fi
          done
          WV="${VER%%-*}"
          IFS='.' read -r M m p <<< "$WV"
          # The default Android code reserves two decimal digits for minor and patch.
          if (( ${#M} > 6 || ${#m} > 2 || ${#p} > 2 )); then
            echo 'VERSION is outside the default Android versionCode range; minor and patch must be below 100.' >&2
            exit 1
          fi
          VC=$(( M * 10000 + m * 100 + p ))
          VC=$(( VC == 0 ? 1 : VC ))
          if (( VC > 2100000000 )); then
            echo 'Calculated Android versionCode exceeds 2100000000.' >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "wails_version=$WV" >> "$GITHUB_OUTPUT"
          echo "short_commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  # ===================== 业务2：Windows 启动器 EXE =====================
  build-launcher:
    runs-on: windows-latest
    needs: setup
    defaults:
      run:
        shell: pwsh
    steps:
      # A. 检出主仓库 (强制清理)
      - name: Checkout MusicParty
        uses: actions/checkout@v4
        with:
          clean: true

      # B. 检出正确的 Netease API 仓库到独立路径
      - name: Checkout Netease API Enhanced
        uses: actions/checkout@v4
        with:
          repository: NeteaseCloudMusicApiEnhanced/api-enhanced
          path: external-api-source
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: music-party-web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
          cache-dependency-path: launcher/go.mod

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Set Wails product version
        run: node -e "const fs=require('fs');const p='launcher/wails.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.info=j.info||{};j.info.productVersion=process.env.MP_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2));"
        env:
          MP_VERSION: ${{ needs.setup.outputs.wails_version }}

      - name: Build Frontend
        run: |
          cd music-party-web
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
        env:
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Build Java Backend
        run: |
          if (Test-Path "src/main/resources/static") { Remove-Item -Recurse -Force "src/main/resources/static" }
          New-Item -ItemType Directory -Force "src/main/resources/static"
          Copy-Item -Recurse "music-party-web/dist/*" "src/main/resources/static/"
          # Pass each Maven argument as a separate quoted PowerShell argument
          & mvn.cmd 'clean' 'package' '-Drevision=${{ needs.setup.outputs.version }}'

      # Bundle the matching Node runtime and source, avoid the legacy Node 18 pkg runtime
      - name: Bundle Netease API and Node.js
        working-directory: ./external-api-source
        run: |
          npm install --omit=dev --ignore-scripts
          $apiTarget = Join-Path $env:GITHUB_WORKSPACE "launcher/bin/netease-api"
          New-Item -ItemType Directory -Force -Path $apiTarget | Out-Null
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination (Join-Path $env:GITHUB_WORKSPACE "launcher/bin/node.exe")
          $nodeLicense = Join-Path (Split-Path (Get-Command node.exe).Source) "LICENSE"
          if (Test-Path -LiteralPath $nodeLicense) { Copy-Item -LiteralPath $nodeLicense -Destination (Join-Path $env:GITHUB_WORKSPACE "launcher/bin/NODE-LICENSE") }
          foreach ($name in @('app.js','main.js','server.js','generateConfig.js','package.json','LICENSE','module','util','plugins','public','data','node_modules')) {
            if (Test-Path -LiteralPath $name) { Copy-Item -LiteralPath $name -Destination $apiTarget -Recurse -Force }
          }

      - name: Prepare Assets
        run: |
          if (-not (Test-Path "launcher/bin")) {
            New-Item -ItemType Directory "launcher/bin"
          }

          # 1. 拷贝 Java 后端 (排除 original JAR)
          echo "Copying Server JAR..."
          $jarFile = Get-ChildItem "target/*.jar" | Where-Object { $_.Name -like "MusicParty*" -and $_.Name -notmatch "original" } | Select-Object -First 1
          if ($jarFile) {
            Copy-Item $jarFile.FullName "launcher/bin/server.jar"
            echo "Copied $($jarFile.Name) to server.jar"
          } else {
            echo "ERROR: Server JAR not found in target/"
            ls target/
            exit 1
          }

          # 2. [优化] 使用 jlink 构建极简 JRE (仅包含必要模块)
          echo "Building custom minimal JRE..."
          # 分析 JAR 依赖模块 (基础模块 + 常用网络/解析模块)
          $modules = "java.base,java.logging,java.naming,java.desktop,java.management,java.security.jgss,java.instrument,java.sql,jdk.unsupported,java.net.http,java.xml,jdk.crypto.ec,jdk.crypto.cryptoki"
          jlink --add-modules $modules --strip-debug --no-man-pages --no-header-files --compress=2 --output launcher/bin/jre

          # 3. 下载并准备 FFmpeg (精简版)
          echo "Downloading FFmpeg..."
          # 使用更加精简的构建版本或继续使用原有版本
          $ffmpegUrl = "https://github.com/GyanD/codexffmpeg/releases/download/7.0.1/ffmpeg-7.0.1-essentials_build.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath temp_ffmpeg
          $ffExe = Get-ChildItem -Path temp_ffmpeg -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffExe.FullName "launcher/bin/ffmpeg.exe"
          Remove-Item ffmpeg.zip, temp_ffmpeg -Recurse -Force

          # 4. [优化] 安装并使用 UPX 压缩二进制
          echo "Installing UPX..."
          choco install upx
          echo "Compressing binaries with UPX..."
          upx --best "launcher/bin/ffmpeg.exe"
          # Keep the bundled Node runtime unmodified
          # 注意：不建议压缩 server.jar，因为它是 ZIP 格式，UPX 处理效果不佳且可能破坏结构

      - name: Build Wails Launcher
        run: |
          $artifactName = 'MusicParty-windows-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.short_commit }}.exe'
          Push-Location launcher
          try {
            go mod tidy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go test -mod=readonly ./pkg/config
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            wails build -platform windows/amd64 -o $artifactName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Path 'dist/windows' -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path 'launcher/build/bin' $artifactName) -Destination (Join-Path 'dist/windows' $artifactName)

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicParty-windows-exe
          path: dist/windows/MusicParty-windows-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.short_commit }}.exe

  # ===================== 业务3：Android APK =====================
  build-apk:
    runs-on: ubuntu-latest
    needs: setup
    # secrets 不能直接在 if 里用，提到 job 级 env；未配置时为空串
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 35)
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug + release APK
        working-directory: android
        run: gradle assembleDebug assembleRelease -PversionName=${{ needs.setup.outputs.version }} -PversionCode=${{ needs.setup.outputs.version_code }}

      - name: Prepare APK delivery filenames
        run: |
          APK_NAME='MusicParty-android-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.short_commit }}.apk'
          mkdir -p dist/android/debug dist/android/release-unsigned
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/debug/$APK_NAME"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/android/release-unsigned/$APK_NAME"

      - name: Upload debug APK (dev 测试用)
        uses: actions/upload-artifact@v4
        with:
          name: music-party-debug
          path: dist/android/debug/MusicParty-android-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.short_commit }}.apk

      # 配置了签名 secrets 才签名（未配置则跳过，仅出未签名 release 包）
      - name: Sign release APK
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > keystore.jks
          mkdir -p dist/android/release
          # apksigner 属于 Android SDK build-tools，默认不在 PATH 上，用完整路径调用
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks keystore.jks \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
            --out 'dist/android/release/MusicParty-android-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.short_commit }}.apk' \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload signed APK (供发布/手动下载)
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: music-party-release
          path: dist/android/release/MusicParty-android-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.short_commit }}.apk

  # ===================== 发布：把 EXE + APK 合并进同一个 Release =====================
  publish:
    runs-on: ubuntu-latest
    needs: [build-launcher, build-apk, setup]
    permissions:
      contents: write   # 发布 GitHub Release 需要
    # tag 推送或手动填了 release_tag 才发布；留空则只出 artifact
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    steps:
      # ⚠️ 必须先 checkout 再下载产物：checkout@v4 默认 clean:true 会 git clean -ffdx，
      # 若先下载 release-artifacts/ 再 checkout，整个目录会被清空，softprops 的 glob 匹配 0 文件 → release 无 assets
      - name: Checkout (for commit log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: MusicParty-windows-exe
          path: release-artifacts/
          merge-multiple: true   # v4 默认按 artifact 名建子目录，flatten 后 release-artifacts/* 才能匹配到文件

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: music-party-release
          path: release-artifacts/
          merge-multiple: true
        continue-on-error: true   # 未配置签名 secrets 时没有该 artifact，不阻塞发布 EXE

      - name: Generate release body
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
            git checkout -q "$RELEASE_TAG"
            REF="$RELEASE_TAG"
          else
            REF="$GITHUB_REF_NAME"
          fi
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline "$PREV..HEAD")
          else
            LOG=$(git log --oneline HEAD)
          fi
          {
            echo "## 版本变更 ($PREV → ${REF})"
            echo ""
            echo '### Commits'
            echo '```'
            echo "$LOG"
            echo '```'
            echo ""
            echo "### Docker 部署"
            printf '%s%s%s\n' '- 精确版本：`docker pull thornex/music-party:' "${DOCKER_TAG#v}" '`'
            echo '- 最新：`docker pull thornex/music-party:latest`'
          } > release-body.md
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DOCKER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

      # 保险：删掉该 tag 已有的 release（draft 或已发布）。
      # softprops 对已存在的 release 只更新正文、跳过 assets 上传（实测手动触发 target 已存在 release 时 0 assets）；
      # 先删再建，保证每次都走 create 路径把 EXE+APK 传进去。
      # 不加 --cleanup-tag：tag 是发布锚点，只删 release 保留 tag。
      # 没有已存在 release 时 delete 报错，|| true 吞掉，幂等。
      - name: Delete existing release (if any)
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

      # tag / 标题 / 正文 自动取 tag 或手动输入
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: ${{ github.ref_type == 'tag' && format('MusicParty {0}', github.ref_name) || inputs.release_name }}
          body_path: release-body.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
