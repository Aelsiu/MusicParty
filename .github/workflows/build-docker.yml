name: Build Docker Image

on:
  push:
    # 只有 dev 分支 push 构建 dev 镜像；master 仅在打 tag 时构建（见下方 tags）
    branches: [ "dev" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: thornex/music-party
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest 仅由 tag 构建的 semver 规则（flavor latest=auto）产出；无分支 push 的 latest 维护
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Compute APP_VERSION
        id: appver
        run: |
          VER="$(cat VERSION)"
          VER="${VER#"${VER%%[![:space:]]*}"}"
          VER="${VER%"${VER##*[![:space:]]}"}"
          PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VER" =~ $PATTERN ]]; then
            echo 'VERSION must contain major.minor.patch or major.minor.patch-prerelease, without a v prefix.' >&2
            exit 1
          fi
          PRERELEASE="${BASH_REMATCH[5]}"
          IFS='.' read -ra IDENTIFIERS <<< "$PRERELEASE"
          for IDENTIFIER in "${IDENTIFIERS[@]}"; do
            if [[ "$IDENTIFIER" =~ ^0[0-9]+$ ]]; then
              echo 'Numeric prerelease identifiers in VERSION must not have leading zeros.' >&2
              exit 1
            fi
          done
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Show image tags and labels
        run: |
          echo "tags: ${{ steps.meta.outputs.tags }}"
          echo "labels: ${{ steps.meta.outputs.labels }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
